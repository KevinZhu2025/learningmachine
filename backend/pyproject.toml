[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "learningmachine-api"
version = "0.1.0"
description = "LearningMachine knowledge import API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "sqlalchemy>=2.0,<3",
    "python-multipart>=0.0.20,<1",
    "python-docx>=1.1,<2",
    "pypdf>=5.0,<7",
    "pymupdf>=1.25,<2",
    "pillow>=11,<13",
    "argon2-cffi>=23.1,<26",
    "azure-storage-blob>=12.24,<13",
    "azure-identity>=1.19,<2",
    "azure-keyvault-secrets>=4.9,<5",
    "openai>=1.66,<3",
    "pyodbc>=5.2,<6",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
