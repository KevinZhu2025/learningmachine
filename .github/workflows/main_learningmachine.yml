# 构建并通过 SSH 部署到阿里云 ECS（Ubuntu 22.04）。
# 需要在 GitHub 仓库 Settings -> Secrets and variables -> Actions 配置：
#   ALICLOUD_ECS_HOST       ECS 公网 EIP（如 8.136.251.167）
#   ALICLOUD_ECS_USER       SSH 用户（如 ubuntu）
#   ALICLOUD_ECS_SSH_KEY    SSH 私钥内容
#   ALICLOUD_DEPLOY_PATH    服务器部署目录（如 /opt/learningmachine）

name: Build and deploy to Alibaba Cloud ECS - learningmachine

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate deployment script
        run: bash -n deploy/deploy.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Test backend
        run: |
          source antenv/bin/activate
          pip install -e "./backend[test]"
          python -m pytest -q backend/tests

      - name: Package deployment artifact
        run: |
          mkdir -p dist
          tar --exclude='./antenv' --exclude='./.git' --exclude='./backend/.data' \
              --exclude='./frontend/node_modules' --exclude='./dist' \
              -czf dist/learningmachine.tar.gz .

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: dist/learningmachine.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: dist

      - name: Copy artifact to ECS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ALICLOUD_ECS_HOST }}
          username: ${{ secrets.ALICLOUD_ECS_USER }}
          key: ${{ secrets.ALICLOUD_ECS_SSH_KEY }}
          source: dist/learningmachine.tar.gz
          target: /tmp

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ALICLOUD_ECS_HOST }}
          username: ${{ secrets.ALICLOUD_ECS_USER }}
          key: ${{ secrets.ALICLOUD_ECS_SSH_KEY }}
          script: |
            set -euo pipefail
            sudo DEPLOY_PATH="${{ secrets.ALICLOUD_DEPLOY_PATH }}" \
              bash -c 'mkdir -p "$DEPLOY_PATH" && tar -xzf /tmp/learningmachine.tar.gz -C "$DEPLOY_PATH" && rm -f /tmp/learningmachine.tar.gz && bash "$DEPLOY_PATH/deploy/deploy.sh"'